<svg width="512" height="512" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tactical Void Background -->
  <rect width="108" height="108" rx="24" fill="#07080B" stroke="#1E293B" stroke-width="2" />
  
  <!-- Concentric radar guides -->
  <circle cx="54" cy="54" r="38" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" />
  <circle cx="54" cy="54" r="28" stroke="#0F172A" stroke-width="1" />
  <line x1="16" y1="54" x2="92" y2="54" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3" />
  <line x1="54" y1="16" x2="54" y2="92" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3" />

  <!-- Forward Red Entropy Blade -->
  <path
    d="M 54,26 A 28,28 0 0,1 82,54 L 88,54 L 79,65 L 70,54 L 76,54 A 22,22 0 0,0 54,32 Z"
    fill="url(#redEntropyGrad)"
  />

  <!-- Inverted Blue Entropy Blade -->
