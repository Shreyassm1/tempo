  <line x1="54" y1="38" x2="54" y2="70" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- T (Forward) in Crisp White -->
  <path
    d="M 37,44 L 51,44 L 51,48 L 46.5,48 L 46.5,64 L 41.5,64 L 41.5,48 L 37,48 Z"
    fill="#F8FAFC"
  />

  <!-- Inverted Ǝ in Crisp White -->
  <path
    d="M 57,44 L 71,44 L 71,48 L 61.5,48 L 61.5,52 L 69,52 L 69,56 L 61.5,56 L 61.5,60 L 71,60 L 71,64 L 57,64 Z"
    fill="#F8FAFC"
  />

  <defs>
    <linearGradient id="redEntropyGrad" x1="54" y1="26" x2="88" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F87171" />
      <stop offset="1" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="blueEntropyGrad" x1="54" y1="82" x2="20" y2="43" gradientUnits="userSpaceOnUse">
